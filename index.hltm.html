<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --bg:      #0f1117;
  --white:   #161820;
  --border:  #23263a;
  --text:    #f1f5f9;
  --sub:     #8b99b5;
  --muted:   #4a5068;
  --blue:    #3b82f6;
  --blue-lt: rgba(59,130,246,0.14);
  --green:   #22c55e;
  --green-lt:rgba(34,197,94,0.12);
  --orange:  #f97316;
  --orange-lt:rgba(249,115,22,0.12);
  --red:     #ef4444;
  --red-lt:  rgba(239,68,68,0.12);
  --purple:  #a855f7;
  --yellow:  #eab308;
  --yellow-lt:rgba(234,179,8,0.12);
  --radius:  8px;
  --font: 'Geist', system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

/* ── NAV ── */
nav {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-logo {
  width: 28px;
  height: 28px;
}
.brand-name {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -.01em;
}
.brand-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .02em;
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-link {
  font-size: 14px;
  color: var(--sub);
  padding: 6px 12px;
  border-radius: 6px;
  transition: background .15s;
}
.nav-link:hover { background: var(--bg); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 16px;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-ghost   { background: var(--white); color: var(--text); border: 1px solid var(--border) !important; }
.btn-green   { background: #25d366; color: #fff; }
.btn-lg { height: 44px; font-size: 14px; padding: 0 22px; }

/* ── HERO ── */
.hero {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 80px 24px 0;
}
.hero-inner {
  max-width: 1080px;
  margin: 0 auto;
}
.hero-text {
  max-width: 600px;
  margin-bottom: 48px;
}
.hero-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-title {
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.025em;
  color: var(--text);
  margin-bottom: 16px;
}
.hero-desc {
  font-size: 17px;
  color: var(--sub);
  line-height: 1.65;
  margin-bottom: 32px;
}
.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ── SCREENSHOT ── */
.screenshot-wrap {
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  box-shadow: 0 2px 24px rgba(0,0,0,.07);
}
.screenshot-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 6px;
}
.dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── APP SCREENSHOT ── */
.app-shell {
  background: #0d0f15;
  font-family: var(--font);
  display: flex;
  flex-direction: column;
}
.app-topbar {
  height: 48px;
  background: #0f1117;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid #1e2030;
  flex-shrink: 0;
}
.app-layout {
  display: flex;
  height: 520px;
}
.app-sidebar {
  width: 180px;
  background: #0f1117;
  border-right: 1px solid #1e2030;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.app-nav-item {
  height: 36px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 500;
  color: #5a6480;
  cursor: default;
}
.app-nav-item.active {
  background: rgba(59,130,246,.15);
  color: #5b9cf6;
}
.app-nav-dot {
  width: 14px; height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
  opacity: .7;
}
.app-content {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
  background: #0d0f15;
}

/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.kpi {
  background: #161820;
  border: 1px solid #23263a;
  border-radius: 8px;
  padding: 14px 16px;
}
.kpi-lbl {
  font-size: 10px;
  font-weight: 600;
  color: #5a6480;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 5px;
}
.kpi-num {
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-note {
  font-size: 10px;
  color: #4a5068;
  margin-top: 4px;
}

/* OS table */
.os-card { background:#161820 !important; 
  background: var(--white);
  border: 1px solid #23263a;
  border-radius: 8px;
  overflow: hidden;
  flex: 1;
}
.os-card-header {
  padding: 11px 16px;
  border-bottom: 1px solid #23263a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.os-card-title {
  font-size: 11px;
  font-weight: 700;
  color: #5a6480;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.os-row {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid #1e2030;
  gap: 10px;
}
.os-row:last-child { border-bottom: none; }
.os-num {
  font-family: var(--mono);
  font-size: 11px;
  color: #6b7acc;
  width: 52px;
  flex-shrink: 0;
}
.os-name {
  font-size: 12px;
  font-weight: 500;
  color: #d4dae8;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 5px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--border);
}

/* ── SECTION ── */
.section {
  max-width: 1080px;
  margin: 0 auto;
  padding: 72px 24px;
}
.section-sm {
  padding: 56px 24px;
}
.s-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.s-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 32px;
  line-height: 1.25;
}

/* ── FOR WHO ── */
.for-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.for-card {
  background: var(--white);
  padding: 28px 24px;
}
.for-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}
.for-desc {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.6;
}

/* ── FEATURES ── */
.feat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.feat-card {
  background: var(--white);
  padding: 28px 24px;
}
.feat-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}
.feat-desc {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.6;
  margin-bottom: 14px;
}
.feat-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.feat-list li {
  font-size: 12px;
  color: var(--sub);
  padding-left: 14px;
  position: relative;
}
.feat-list li::before {
  content: '—';
  position: absolute;
  left: 0;
  color: var(--muted);
  font-size: 10px;
}

/* ── COMING SOON ── */
.soon-section {
  background: var(--white);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 72px 24px;
}
.soon-inner {
  max-width: 1080px;
  margin: 0 auto;
}
.soon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 32px;
}
.soon-card {
  background: var(--bg);
  padding: 24px;
  position: relative;
}
.soon-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--orange);
  background: var(--orange-lt);
  border: 1px solid rgba(249,115,22,0.3);
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 14px;
}
.soon-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
}
.soon-desc {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.6;
}

/* ── CTA ── */
.cta-section {
  max-width: 1080px;
  margin: 0 auto;
  padding: 80px 24px;
  display: flex;
  gap: 80px;
  align-items: flex-start;
}
.cta-left { flex: 1; }
.cta-right {
  flex-shrink: 0;
  width: 340px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
}
.cta-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.2;
  margin-bottom: 14px;
}
.cta-desc {
  font-size: 15px;
  color: var(--sub);
  line-height: 1.65;
  margin-bottom: 28px;
}
.cta-feature-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cta-feature-list li {
  font-size: 13px;
  color: var(--sub);
  display: flex;
  align-items: center;
  gap: 10px;
}
.cta-feature-list li::before {
  content: '';
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--green-lt);
  border: 1px solid rgba(34,197,94,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 6l3 3 5-5' stroke='%2322c55e' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
}
.form-field {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  margin-bottom: 5px;
}
.form-input {
  width: 100%;
  height: 40px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  padding: 0 12px;
  outline: none;
  transition: border-color .15s;
}
.form-input:focus { border-color: var(--blue); }
.form-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.5;
}

/* ── FOOTER ── */
footer {
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 40px 24px 32px;
}
.footer-inner {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-copy {
  font-size: 13px;
  color: var(--muted);
}
.footer-links {
  display: flex;
  gap: 24px;
}
.footer-links a {
  font-size: 13px;
  color: var(--sub);
}
.footer-links a:hover { color: var(--text); }

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  .for-grid    { grid-template-columns: 1fr 1fr; }
  .feat-grid   { grid-template-columns: 1fr; }
  .soon-grid   { grid-template-columns: 1fr 1fr; }
  .kpi-row     { grid-template-columns: 1fr 1fr; }
  .app-sidebar { display: none; }
  .cta-section { flex-direction: column; gap: 40px; }
  .cta-right   { width: 100%; }
  .nav-link    { display: none; }
  .footer-inner { flex-direction: column; gap: 16px; text-align: center; }
}
@media (max-width: 540px) {
  .for-grid  { grid-template-columns: 1fr; }
  .soon-grid { grid-template-columns: 1fr; }
  .hero-actions { flex-direction: column; }
  .btn-lg { width: 100%; justify-content: center; }
}
</style>
</head>
